<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff0033'/%3E%3Cpath d='M4 11h24v4H4zM7 15h3v11H7zm15 0h3v11h-3zM7 20h18v2.5H7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --raised:#ffffff; --text:#0f0f0f; --text2:#606060; --chip:#f2f2f2; --chip-hover:#e5e5e5;
    --chip-on:#0f0f0f; --chip-on-text:#ffffff; --line:#e5e5e5; --hover:#f2f2f2; --red:#ff0033; --badge:rgba(0,0,0,.6);
    --search-bg:#ffffff; --search-btn:#f8f8f8; --search-line:#d3d3d3; --skeleton:#e5e5e5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f0f; --raised:#212121; --text:#f1f1f1; --text2:#aaaaaa; --chip:#272727; --chip-hover:#3f3f3f;
      --chip-on:#f1f1f1; --chip-on-text:#0f0f0f; --line:#3f3f3f; --hover:#272727;
      --search-bg:#121212; --search-btn:#222222; --search-line:#303030; --skeleton:#272727; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Roboto,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .ic{width:24px;height:24px;fill:currentColor;flex:none}

  /* ---------- top bar ---------- */
  .mast{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;background:var(--bg)}
  .mast .l{display:flex;align-items:center;gap:16px;min-width:200px}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer}
  .iconbtn:hover{background:var(--hover)}
  .logo{display:flex;align-items:center;gap:4px;font:700 19px/1 Roboto,sans-serif;letter-spacing:-.6px}
  .logo .mark{width:26px;height:26px;border-radius:7px;background:var(--red);display:grid;place-items:center;margin-right:3px}
  .logo .word{display:flex}
  .logo sup{font:400 10px Roboto;color:var(--text2);letter-spacing:0;margin-left:2px;align-self:flex-start;margin-top:-2px}
  .search{flex:0 1 732px;display:flex;align-items:center;margin:0 40px}
  .search input{flex:1;height:40px;border:1px solid var(--search-line);border-right:0;border-radius:40px 0 0 40px;
    background:var(--search-bg);color:var(--text);font:16px Roboto,sans-serif;padding:0 16px;outline:none;min-width:0}
  .search input:focus{border-color:#1c62b9}
  .search button{height:40px;width:64px;border:1px solid var(--search-line);border-radius:0 40px 40px 0;background:var(--search-btn);cursor:pointer;display:grid;place-items:center}
  .mast .r{display:flex;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}
  .mast select{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:500 14px Roboto;padding:0 12px;cursor:pointer}
  .me{width:32px;height:32px;border-radius:50%;background:#7b4fd6;color:#fff;display:grid;place-items:center;font:500 14px Roboto}

  /* ---------- sidebar ---------- */
  .layout{display:flex}
  .guide{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;width:240px;flex:none;padding:12px;scrollbar-width:thin}
  .guide a,.guide button.item{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;width:100%;
    border:0;background:none;cursor:pointer;font:400 14px Roboto;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .guide a:hover,.guide button.item:hover{background:var(--hover)}
  .guide .on{background:var(--hover);font-weight:500!important}
  .guide hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .guide h4{font:500 16px Roboto;margin:6px 12px 4px}
  .guide .av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;color:#fff;font:500 12px Roboto}
  .guide .foot{font-size:12px;color:var(--text2);padding:12px;line-height:1.6}
  body.mini .guide{width:72px;padding:4px}
  body.mini .guide a,body.mini .guide button.item{flex-direction:column;gap:6px;height:74px;justify-content:center;font-size:10px;padding:0}
  body.mini .guide .full{display:none}
  @media (max-width:1312px){ body:not(.open) .guide{width:72px;padding:4px}
    body:not(.open) .guide a, body:not(.open) .guide button.item{flex-direction:column;gap:6px;height:74px;justify-content:center;font-size:10px;padding:0}
    body:not(.open) .guide .full{display:none} }
  @media (max-width:792px){ .guide{display:none} body.open .guide{display:block;position:fixed;left:0;top:56px;z-index:30;background:var(--bg);width:240px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)} }

  /* ---------- chips ---------- */
  main{flex:1;min-width:0;padding:0 24px 60px}
  .chips{position:sticky;top:56px;z-index:10;background:var(--bg);display:flex;gap:12px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--chip);font:500 14px Roboto;cursor:pointer;white-space:nowrap;flex:none}
  .chip:hover{background:var(--chip-hover)}
  .chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-text)}
  .status{color:var(--text2);font-size:14px;margin:8px 0 16px}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:40px 16px}
  @media (min-width:1900px){.grid{grid-template-columns:repeat(5,1fr)}}
  .v{min-width:0}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--skeleton);cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .thumb:hover img{transform:scale(1.02)}
  .thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .dur{position:absolute;right:8px;bottom:8px;background:var(--badge);color:#fff;font:500 12px Roboto;padding:1px 4px;border-radius:4px}
  .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
  .prog i{display:block;height:100%;width:100%;background:var(--red)}
  .details{display:flex;gap:12px;margin-top:12px;padding-right:24px}
  .avatar{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;color:#fff;font:500 15px Roboto}
  .title{font:500 16px/22px Roboto,sans-serif;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--text2);font-size:14px;line-height:20px}
  .meta a:hover{color:var(--text)}
  .badge{display:inline-block;font:500 12px Roboto;background:var(--chip);color:var(--text2);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
  .badge.always{color:var(--text)}
  .dot::before{content:"•";margin:0 4px}
  .empty{padding:80px 0;text-align:center;color:var(--text2);font-size:16px}

  @media (max-width:656px){
    .mast{padding:0 8px}.mast .l{min-width:0;gap:4px;flex:none}.logo .word{display:none}.search{margin:0 6px;flex:1 1 auto;min-width:0}.search button{display:none}.search input{border-right:1px solid var(--search-line);border-radius:40px;height:36px;font-size:15px}.mast .r{min-width:0;flex:none;gap:2px}.mast select{max-width:96px;padding:0 6px}.me{display:none}
    main{padding:0 0 40px}.chips{padding:12px}.status{margin:4px 12px 12px}
    .grid{grid-template-columns:1fr;gap:24px}.thumb{border-radius:0}.details{padding:0 12px}
  }
</style>
</head>
<body>
<header class="mast">
  <div class="l">
    <button class="iconbtn" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg></button>
    <a class="logo" href="./" title="The Bench home">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 5h14v2.5H1zM3 7.5h2V14H3zm8 0h2V14h-2zM3 10.5h10V12H3z" fill="#fff"/></svg></span><span class="word">TheBench<sup>CO</sup></span>
    </a>
  </div>
  <form class="search" role="search" onsubmit="return false">
    <input id="q" type="search" placeholder="Search today's builds" aria-label="Search videos">
    <button aria-label="Search"><svg class="ic" viewBox="0 0 24 24"><path d="M16.3 15.6 21 20.3l-.7.7-4.7-4.7a7.5 7.5 0 1 1 .7-.7zM10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z"/></svg></button>
  </form>
  <div class="r">
    <select id="day" aria-label="Pick a day"></select>
    <a class="iconbtn" href="stats.html" title="Stats" aria-label="Stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16v1H4zM6 10h3v8H6zm5-5h3v13h-3zm5 8h3v5h-3z"/></svg></a>
    <div class="me" title="Geoff">G</div>
  </div>
</header>

<div class="layout">
  <nav class="guide" id="guide" aria-label="Guide">
    <button class="item on" data-go=""><svg class="ic" viewBox="0 0 24 24"><path d="M4 21V10.1l8-6.2 8 6.2V21h-5v-6H9v6H4z"/></svg><span>Home</span></button>
    <button class="item" data-go="month"><svg class="ic" viewBox="0 0 24 24"><path d="m12 2 2.9 6.9 7.1.6-5.4 4.7 1.6 7.3L12 17.8 5.8 21.5l1.6-7.3L2 9.5l7.1-.6z"/></svg><span>Best of month</span></button>
    <a href="stats.html"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16v1H4zM6 10h3v8H6zm5-5h3v13h-3zm5 8h3v5h-3z"/></svg><span>Stats</span></a>
    <div class="full">
      <hr><h4>Recent days</h4><div id="days"></div>
      <hr><h4>Channels here</h4><div id="chans"></div>
      <hr><div class="foot">Half indie makers · no doom, no markets, no news (except Fireship &amp; AI Explained) · refreshed every morning</div>
    </div>
  </nav>

  <main>
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="indie">Indie makers</button>
      <button class="chip" data-f="big">Big channels</button>
      <button class="chip" data-f="always">Fireship &amp; AI Explained</button>
      <button class="chip" data-f="short">Under 10 minutes</button>
      <button class="chip" data-f="long">20 minutes+</button>
      <button class="chip" data-f="unwatched">Not watched</button>
    </div>
    <div class="status" id="status">Loading…</div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let watched = new Set(store.get('watched', []));
let feed = null, filter = 'all', query = '', chanFilter = null, currentDay = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const views = n => n >= 1e9 ? (n/1e9).toFixed(1).replace(/\.0$/,'') + 'B views' : n >= 1e6 ? (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/,'') + 'M views'
  : n >= 1e3 ? (n/1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/,'') + 'K views' : n === 1 ? '1 view' : (n || 0) + ' views';
const subsTxt = n => !n ? '' : n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'K' : String(n);
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000;
  for (const [u, n] of [['year',31536e3],['month',2592e3],['week',604800],['day',86400],['hour',3600],['minute',60]])
    if (s >= n) { const k = Math.floor(s / n); return `${k} ${u}${k > 1 ? 's' : ''} ago`; }
  return 'just now'; };
const dur = s => !s ? '' : s < 3600 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const hue = str => [...String(str)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = (v, cls = 'avatar') => v.avatar
  ? `<img class="${cls}" src="${esc(v.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
  : `<span class="${cls}" style="background:hsl(${hue(v.channelId)} 45% 45%)">${esc((v.channel || '?').trim()[0].toUpperCase())}</span>`;

function visible(){
  return (feed?.videos || []).filter(v => {
    if (chanFilter && v.channelId !== chanFilter) return false;
    if (query && !(v.title + ' ' + v.channel).toLowerCase().includes(query)) return false;
    switch (filter){
      case 'indie': return v.tier === 'indie';
      case 'big': return v.tier !== 'indie' && !v.always;
      case 'always': return v.always;
      case 'short': return v.duration && v.duration < 600;
      case 'long': return v.duration >= 1200;
      case 'unwatched': return !watched.has(v.id);
    }
    return true;
  });
}

function card(v){
  const tag = v.always ? '<span class="badge always">Always on</span>' : v.tier === 'indie' ? `<span class="badge" title="Under 100K subscribers">Indie${v.subs ? ' · ' + subsTxt(v.subs) : ''}</span>` : '';
  const ch = `https://www.youtube.com/channel/${esc(v.channelId)}`;
  return `<div class="v">
    <div class="thumb" data-id="${esc(v.id)}" title="${esc(v.blurb || '')}">
      <img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="">
      ${v.duration ? `<span class="dur">${dur(v.duration)}</span>` : ''}
      ${watched.has(v.id) ? '<div class="prog"><i></i></div>' : ''}
    </div>
    <div class="details">
      <a href="${ch}" target="_blank" rel="noopener">${avatar(v)}</a>
      <div style="min-width:0">
        <a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener"><h3 class="title">${esc(v.title)}</h3></a>
        <div class="meta"><a href="${ch}" target="_blank" rel="noopener">${esc(v.channel)}</a>${tag}</div>
        <div class="meta">${views(v.views)}<span class="dot">${ago(v.published)}</span></div>
      </div>
    </div>
  </div>`;
}

function render(){
  const vids = visible();
  $('#grid').innerHTML = vids.map(card).join('') || `<div class="empty">Nothing here${query ? ` for "${esc(query)}"` : ''} — try another chip or day.</div>`;
  const when = feed && new Date(feed.generated);
  $('#status').textContent = !feed ? 'No feed found yet.'
    : feed.month ? `The ${feed.count} biggest breakouts of the past 30 days`
    : `${feed.count} builds · ${currentDay ? when.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }) + (feed.backfilled ? ' (rebuilt from the archive)' : '') : 'curated this morning'}`
      + (chanFilter ? ` · filtered to ${feed.videos.find(v => v.channelId === chanFilter)?.channel}` : '');
  // sidebar channel list
  const seen = new Map(); for (const v of feed?.videos || []) if (!seen.has(v.channelId)) seen.set(v.channelId, v);
  $('#chans').innerHTML = [...seen.values()].slice(0, 30).map(v =>
    `<button class="item ${chanFilter === v.channelId ? 'on' : ''}" data-ch="${esc(v.channelId)}">${avatar(v, 'av')}<span>${esc(v.channel)}</span></button>`).join('');
}

/* ---------- interactions ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('.thumb');
  if (t && !t.querySelector('iframe')) {
    const id = t.dataset.id;
    t.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    watched.add(id); store.set('watched', [...watched].slice(-3000));
    return;
  }
  const c = e.target.closest('.chip');
  if (c) { filter = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c)); render(); return; }
  const ch = e.target.closest('[data-ch]');
  if (ch) { chanFilter = chanFilter === ch.dataset.ch ? null : ch.dataset.ch; render(); return; }
  const go = e.target.closest('[data-go]');
  if (go) { load(go.dataset.go); if (innerWidth <= 792) document.body.classList.remove('open'); }
});
$('#menu').onclick = () => {
  if (innerWidth > 1312) document.body.classList.toggle('mini');
  else document.body.classList.toggle('open');
};
$('#q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
$('#day').onchange = e => load(e.target.value);

/* ---------- data ---------- */
async function bestOfMonth(){
  const d = await (await fetch('videos.json?t=' + Date.now())).json();
  const s = v => v.perf * Math.log10(v.views + 10);
  const ok = d.videos.filter(v => !v.short && !v.live && !v.blocked && v.perf != null).sort((a,b) => s(b) - s(a));
  const picked = [], per = {};
  const take = (list, max) => { for (const v of list) { if (picked.length >= max) return;
    if (picked.includes(v) || (per[v.channelId] || 0) >= 2) continue; per[v.channelId] = (per[v.channelId] || 0) + 1; picked.push(v); } };
  take(ok.filter(v => v.tier === 'indie'), 15); take(ok, 30);
  picked.sort((a,b) => s(b) - s(a));
  for (const v of picked) v.always = v.tier === 'always';
  return { generated: d.generated, count: picked.length, videos: picked, month: true };
}

async function load(day){
  currentDay = day; chanFilter = null;
  $('#day').value = day;
  document.querySelectorAll('.guide [data-go], #days [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === day));
  $('#q').placeholder = day === 'month' ? 'Search this month\'s best' : day ? 'Search this day' : 'Search today\'s builds';
  try { feed = day === 'month' ? await bestOfMonth() : await (await fetch((day ? `archive/${day}.json` : 'feed.json') + '?t=' + Date.now())).json(); }
  catch { feed = null; }
  render(); scrollTo(0, 0);
}

(async () => {
  const nice = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  let days = [];
  try { days = await (await fetch('archive/index.json?t=' + Date.now())).json(); } catch {}
  $('#day').innerHTML = `<option value="">Today</option><option value="month">Best of month</option>` + days.slice(1).map(d => `<option value="${d}">${nice(d)}</option>`).join('');
  $('#days').innerHTML = days.slice(1, 8).map(d =>
    `<button class="item" data-go="${d}"><svg class="ic" viewBox="0 0 24 24"><path d="M17 3V1h-1v2H8V1H7v2H3v18h18V3h-4zm3 17H4V8h16v12z"/></svg><span>${nice(d)}</span></button>`).join('');
  load('');
})();
</script>
</body>
</html>
